<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upstream — Procurement Intelligence</title>
  <style>
    :root {
      --bg: #0d0f12;
      --surface: #161a20;
      --surface2: #1e242d;
      --border: #252b35;
      --text: #e8eaf0;
      --muted: #7a8494;
      --accent: #3d8ef0;
      --accent-dim: rgba(61,142,240,0.12);
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.12);
      --yellow: #f59e0b;
      --yellow-dim: rgba(245,158,11,0.12);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --orange: #f97316;
      --orange-dim: rgba(249,115,22,0.12);
      --purple: #a855f7;
      --purple-dim: rgba(168,85,247,0.10);
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }

    /* ── Top nav ── */
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
    .nav-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -0.3px; }
    .nav-logo { width: 28px; height: 28px; background: linear-gradient(135deg, #3d8ef0, #a855f7); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .nav-subtitle { color: var(--muted); font-size: 12px; font-weight: 400; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; text-decoration: none; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: #2d7ee0; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
    .badge-red { background: var(--red-dim); color: var(--red); }
    .badge-orange { background: var(--orange-dim); color: var(--orange); }
    .badge-yellow { background: var(--yellow-dim); color: var(--yellow); }
    .badge-green { background: var(--green-dim); color: var(--green); }
    .badge-blue { background: var(--accent-dim); color: var(--accent); }
    .badge-purple { background: var(--purple-dim); color: var(--purple); }

    /* ── Layout ── */
    .container { max-width: 1280px; margin: 0 auto; padding: 28px; }
    .header { margin-bottom: 28px; }
    .header-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
    .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; }
    .header-meta { color: var(--muted); font-size: 13px; margin-top: 4px; display: flex; gap: 18px; }
    .header-meta span { display: flex; align-items: center; gap: 4px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }
    .dot.pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{ opacity:1; } 50%{ opacity:0.4; } }

    /* ── Grid ── */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .col-span-2 { grid-column: span 2; }
    .col-span-3 { grid-column: span 3; }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .card-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
    .card-action { font-size: 12px; color: var(--accent); cursor: pointer; }

    /* ── KPI tiles ── */
    .kpi { display: flex; flex-direction: column; gap: 6px; }
    .kpi-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
    .kpi-label { font-size: 12px; color: var(--muted); }
    .kpi-delta { font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 3px; }
    .kpi-delta.bad { color: var(--red); }
    .kpi-delta.warn { color: var(--yellow); }
    .kpi-delta.good { color: var(--green); }

    /* ── Health score ring ── */
    .health-ring-wrap { display: flex; align-items: center; gap: 20px; }
    .health-ring { position: relative; width: 88px; height: 88px; flex-shrink: 0; }
    .health-ring svg { transform: rotate(-90deg); }
    .health-ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .health-score-num { font-size: 22px; font-weight: 800; color: var(--orange); line-height: 1; }
    .health-score-sub { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .health-details { flex: 1; }
    .health-detail-row { display: flex; justify-content: space-between; font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--border); }
    .health-detail-row:last-child { border: none; }
    .health-detail-label { color: var(--muted); }
    .health-detail-val { font-weight: 600; }
    .health-detail-val.bad { color: var(--red); }
    .health-detail-val.warn { color: var(--yellow); }
    .health-detail-val.good { color: var(--green); }

    /* ── Alert cards ── */
    .alerts-list { display: flex; flex-direction: column; gap: 12px; }
    .alert-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; position: relative; overflow: hidden; cursor: pointer; transition: border-color 0.15s; }
    .alert-card:hover { border-color: var(--accent); }
    .alert-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
    .alert-card.critical::before { background: var(--red); }
    .alert-card.high::before { background: var(--orange); }
    .alert-card.medium::before { background: var(--yellow); }
    .alert-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .alert-title { font-size: 13px; font-weight: 600; line-height: 1.4; }
    .alert-impact { text-align: right; flex-shrink: 0; }
    .alert-impact-value { font-size: 18px; font-weight: 700; color: var(--red); line-height: 1; }
    .alert-impact-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; }
    .alert-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
    .alert-rec { background: rgba(61,142,240,0.07); border: 1px solid rgba(61,142,240,0.2); border-radius: 6px; padding: 10px 12px; font-size: 12px; color: #9cb8e8; line-height: 1.5; }
    .alert-rec strong { color: var(--accent); }
    .alert-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .alert-meta { font-size: 11px; color: var(--muted); display: flex; gap: 10px; }
    .alert-actions { display: flex; gap: 8px; }

    /* ── Vendor benchmark table ── */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .price-diff.over { color: var(--red); font-weight: 600; }
    .price-diff.under { color: var(--green); font-weight: 600; }
    .price-diff.neutral { color: var(--muted); }
    .savings-tag { display: inline-flex; align-items: center; background: var(--green-dim); color: var(--green); padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }

    /* ── Channel margin bars ── */
    .channel-list { display: flex; flex-direction: column; gap: 14px; }
    .channel-row { display: flex; flex-direction: column; gap: 5px; }
    .channel-label { display: flex; justify-content: space-between; font-size: 12px; }
    .channel-name { font-weight: 500; }
    .channel-pct { font-weight: 700; }
    .channel-pct.good { color: var(--green); }
    .channel-pct.warn { color: var(--yellow); }
    .channel-pct.bad { color: var(--red); }
    .bar-track { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s ease; }
    .bar-fill.green { background: var(--green); }
    .bar-fill.yellow { background: var(--yellow); }
    .bar-fill.red { background: var(--red); }
    .bar-fill.orange { background: var(--orange); }
    .channel-detail { font-size: 11px; color: var(--muted); }

    /* ── Price trend sparkline ── */
    .sparkline-wrap { display: flex; flex-direction: column; gap: 14px; }
    .spark-item { display: flex; align-items: center; gap: 12px; }
    .spark-label { font-size: 12px; color: var(--muted); width: 100px; flex-shrink: 0; }
    .spark-svg { flex: 1; height: 32px; }
    .spark-current { font-size: 12px; font-weight: 700; width: 52px; text-align: right; flex-shrink: 0; }
    .spark-current.up { color: var(--red); }
    .spark-current.stable { color: var(--green); }

    /* ── Recommendations ── */
    .rec-list { display: flex; flex-direction: column; gap: 12px; }
    .rec-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .rec-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; gap: 12px; }
    .rec-title { font-size: 13px; font-weight: 600; line-height: 1.4; }
    .rec-savings { text-align: right; flex-shrink: 0; }
    .rec-savings-val { font-size: 15px; font-weight: 700; color: var(--green); }
    .rec-savings-label { font-size: 10px; color: var(--muted); }
    .rec-desc { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
    .rec-steps { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .rec-step { display: flex; gap: 10px; font-size: 12px; }
    .rec-step-num { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .rec-step-text { color: var(--muted); line-height: 1.5; padding-top: 1px; }
    .rec-step-text strong { color: var(--text); }
    .rec-footer { display: flex; align-items: center; justify-content: space-between; }
    .rec-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-accept { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .btn-accept:hover { background: rgba(34,197,94,0.2); }

    /* ── Menu engineering ── */
    .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .menu-quadrant { border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .quadrant-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
    .quadrant-label.star { color: var(--green); }
    .quadrant-label.plow { color: var(--orange); }
    .quadrant-label.puzzle { color: var(--purple); }
    .quadrant-label.dog { color: var(--muted); }
    .menu-item-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
    .menu-item-name { color: var(--text); }
    .menu-item-margin { color: var(--muted); }

    /* ── Acquisition pitch banner ── */
    .acq-banner { background: linear-gradient(135deg, rgba(61,142,240,0.08), rgba(168,85,247,0.08)); border: 1px solid rgba(61,142,240,0.2); border-radius: var(--radius); padding: 24px 28px; margin-top: 32px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .acq-left { flex: 1; }
    .acq-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .acq-desc { font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 600px; }
    .acq-stats { display: flex; gap: 32px; flex-shrink: 0; }
    .acq-stat { text-align: center; }
    .acq-stat-val { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .acq-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

    /* ── Loader ── */
    .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; }
    .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { color: var(--muted); font-size: 14px; }

    /* ── Error ── */
    .error-state { text-align: center; padding: 60px 24px; }
    .error-icon { font-size: 36px; margin-bottom: 12px; }
    .error-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .error-desc { color: var(--muted); font-size: 13px; line-height: 1.6; max-width: 420px; margin: 0 auto 20px; }

    /* ── Confidence pill ── */
    .conf { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
    .conf-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }

    @media (max-width: 900px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .acq-banner { flex-direction: column; }
      .acq-stats { justify-content: center; }
      .menu-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">
    <div class="nav-logo">↑</div>
    <div>
      <div>Upstream</div>
      <div class="nav-subtitle">Procurement Intelligence</div>
    </div>
  </div>
  <div class="nav-actions">
    <span class="conf"><span class="conf-dot pulse"></span>Live scanning</span>
    <select id="restaurant-switcher" onchange="switchRestaurant(this.value)" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:7px 10px;font-size:13px;cursor:pointer">
      <option value="harvest">Harvest &amp; Co. (Demo)</option>
      <option value="mickey-malones">Mickey Malone's Tavern</option>
    </select>
    <button class="btn btn-ghost" id="live-prices-btn" onclick="triggerLivePrices()" title="Fetch live USDA AMS + area vendor prices">Live Prices</button>
    <button class="btn btn-ghost" onclick="triggerScan()">Run Analysis</button>
    <button class="btn btn-primary" onclick="window.location='/dashboard.html'">← Dashboard</button>
  </div>
</nav>

<div id="app">
  <div class="loader">
    <div class="spinner"></div>
    <div class="loader-text">Loading procurement intelligence…</div>
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let state = { restaurant: null, alerts: [], recommendations: [], snapshot: null };
let currentRestaurant = 'harvest';

// ── Restaurant switcher ───────────────────────────────────────────────────────
function switchRestaurant(which) {
  currentRestaurant = which;
  const url = new URL(window.location);
  url.searchParams.set('r', which);
  window.history.replaceState({}, '', url);
  document.getElementById('app').innerHTML = '<div class="loader"><div class="spinner"></div><div class="loader-text">Loading…</div></div>';
  state = { restaurant: null, alerts: [], recommendations: [], snapshot: null };
  if (which === 'mickey-malones') {
    initMickeyMalones();
  } else {
    initHarvest();
  }
}

// ── Bootstrap ────────────────────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  const r = params.get('r') || 'harvest';
  currentRestaurant = r;
  const sel = document.getElementById('restaurant-switcher');
  if (sel) sel.value = r;
  if (r === 'mickey-malones') {
    await initMickeyMalones();
  } else {
    await initHarvest();
  }
}

async function initHarvest() {
  try {
    const res = await fetch('/api/procurement/demo');
    const data = await res.json();
    if (!res.ok || !data.restaurant) {
      const seedRes = await fetch('/api/procurement/demo/seed', { method: 'POST' });
      if (!seedRes.ok) throw new Error('Demo seed failed');
      const seeded = await seedRes.json();
      await loadRestaurant(seeded.restaurantId);
    } else {
      state.restaurant = data.restaurant;
      state.alerts = data.alerts || [];
      state.recommendations = data.recommendations || [];
      state.snapshot = data.snapshot || null;
      render();
    }
  } catch (err) {
    renderWithMockData();
  }
}

async function initMickeyMalones() {
  try {
    const res = await fetch('/api/procurement/demo/mickey-malones');
    if (res.status === 404) {
      const seedRes = await fetch('/api/procurement/demo/seed-mickey-malones', { method: 'POST' });
      if (!seedRes.ok) throw new Error('Seed failed');
      const again = await fetch('/api/procurement/demo/mickey-malones');
      if (!again.ok) throw new Error('Load after seed failed');
      const data = await again.json();
      applyMickeyMalonesState(data);
    } else if (res.ok) {
      const data = await res.json();
      applyMickeyMalonesState(data);
    } else {
      throw new Error('API error');
    }
  } catch (err) {
    renderFull(getMickeyMalonesData());
  }
}

function applyMickeyMalonesState(data) {
  state.restaurant = data.restaurant;
  state.alerts = data.alerts || [];
  state.recommendations = data.recommendations || [];
  state.snapshot = data.snapshot || null;
  render();
}

async function loadRestaurant(id) {
  const r = await fetch(`/api/procurement/restaurants/${id}/dashboard`);
  const data = await r.json();
  state = { ...data };
  render();
}

async function triggerScan() {
  if (!state.restaurant) return;
  const btns = document.querySelectorAll('.btn-ghost');
  btns.forEach(b => b.disabled = true);
  const scanBtn = [...btns].find(b => b.textContent.includes('Run'));
  if (scanBtn) scanBtn.textContent = 'Scanning…';
  await fetch(`/api/procurement/restaurants/${state.restaurant.id}/analyze`, { method: 'POST' });
  await loadRestaurant(state.restaurant.id);
  if (scanBtn) scanBtn.textContent = 'Run Analysis';
  btns.forEach(b => b.disabled = false);
}

async function triggerLivePrices() {
  const btn = document.getElementById('live-prices-btn');
  if (!btn) return;
  btn.textContent = 'Fetching…';
  btn.disabled = true;

  if (!state.restaurant?.id) {
    // Mock mode — show live benchmark panel with explanatory note
    showLivePricePanel(null, null, null);
    btn.textContent = 'Live Prices';
    btn.disabled = false;
    return;
  }

  try {
    const [benchRes, vendorRes] = await Promise.all([
      fetch(`/api/procurement/restaurants/${state.restaurant.id}/vendor-benchmark?live=true`),
      fetch(`/api/procurement/restaurants/${state.restaurant.id}/area-vendors`)
    ]);
    const bench = benchRes.ok ? await benchRes.json() : null;
    const vendors = vendorRes.ok ? await vendorRes.json() : null;

    // Also trigger price refresh in background
    fetch(`/api/procurement/restaurants/${state.restaurant.id}/refresh-prices`, { method: 'POST' })
      .catch(() => null);

    showLivePricePanel(bench, vendors, state.restaurant);
  } catch (err) {
    showLivePricePanel(null, null, state.restaurant);
  } finally {
    btn.textContent = 'Live Prices';
    btn.disabled = false;
  }
}

function showLivePricePanel(bench, vendors, restaurant) {
  const existing = document.getElementById('live-price-panel');
  if (existing) existing.remove();

  const overchargeRows = bench?.benchmark?.filter(b => b.overcharge_pct > 5)
    .sort((a, b) => (b.monthly_overcharge||0) - (a.monthly_overcharge||0)) || [];

  const areaVendors = vendors?.area_vendors?.filter(v => !v.already_registered)
    .slice(0, 6) || [];

  const mockBenchmark = currentRestaurant === 'mickey-malones' ? [
    { ingredient: 'Mozzarella Cheese', unit: 'lb', paid_price: 4.50, market_price: 3.82, overcharge_pct: 17.8, monthly_overcharge: 872, severity: 'high', data_source: 'ai_market_estimate', confidence: 0.87 },
    { ingredient: 'Chicken Wings',     unit: 'lb', paid_price: 2.85, market_price: 2.38, overcharge_pct: 19.7, monthly_overcharge: 376, severity: 'high', data_source: 'ai_market_estimate', confidence: 0.85 },
    { ingredient: 'Jameson Irish Whiskey', unit: '750ml', paid_price: 18.50, market_price: 15.90, overcharge_pct: 16.4, monthly_overcharge: 218, severity: 'high', data_source: 'ai_market_estimate', confidence: 0.82 },
    { ingredient: 'Ground Beef 80/20', unit: 'lb', paid_price: 4.50, market_price: 4.18, overcharge_pct: 7.7, monthly_overcharge: 128, severity: 'medium', data_source: 'ai_market_estimate', confidence: 0.88 },
  ] : [
    { ingredient: 'Avocado (Hass)', unit: 'lb', paid_price: 1.85, market_price: 1.22, overcharge_pct: 51.6, monthly_overcharge: 1210, severity: 'critical', data_source: 'usda_ams', confidence: 0.98 },
    { ingredient: 'Roma Tomato',    unit: 'lb', paid_price: 1.18, market_price: 0.94, overcharge_pct: 25.5, monthly_overcharge: 228, severity: 'high',     data_source: 'usda_ams', confidence: 0.97 },
  ];

  const mockVendors = currentRestaurant === 'mickey-malones' ? [
    { name: 'Boston Produce Company', category: 'produce', address: 'Chelsea, MA', service_area: 'Greater Boston, Brockton, South Shore', website: 'bostonproduce.com', price_tier: 'market_rate', known_for: 'Boston Terminal Market fresh produce, daily delivery', lead_time_days: 1 },

function renderAlert(a) {
  const severityLabel = { critical: 'CRITICAL', high: 'HIGH', medium: 'MEDIUM' };
  const severityBadge = { critical: 'badge-red', high: 'badge-orange', medium: 'badge-yellow' };
  const typeLabel = {
    vendor_overcharge: 'Vendor Overcharge',
    recipe_cost_drift: 'Recipe Cost Drift',
    delivery_erosion:  'Delivery Erosion',
    order_inefficiency:'Order Inefficiency'
  };

  return `
    <div class="alert-card ${a.severity}">
      <div class="alert-top">
        <div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
            <span class="badge ${severityBadge[a.severity]}">${severityLabel[a.severity]}</span>
            <span class="badge badge-blue">${typeLabel[a.alert_type] || a.alert_type}</span>
            <span class="conf"><span class="conf-dot"></span>${Math.round((a.confidence_score||0.9)*100)}% confidence</span>
          </div>
          <div class="alert-title">${a.title}</div>
        </div>
        <div class="alert-impact">
          <div class="alert-impact-value">-$${(a.financial_impact_monthly||0).toLocaleString()}</div>
          <div class="alert-impact-label">per month</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">$${((a.financial_impact_monthly||0)*12).toLocaleString()}/yr</div>
        </div>
      </div>
      <div class="alert-desc">${a.description}</div>
      <div class="alert-rec"><strong>Recommended action:</strong> ${a.ai_recommendation}</div>
    </div>
  `;
}

function renderSparkline(p) {
  const vals = p.trend || [];
  if (vals.length < 2) return '';
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = max - min || 1;
  const w = 200, h = 32, pad = 4;
  const points = vals.map((v, i) => {
    const x = pad + (i / (vals.length - 1)) * (w - pad * 2);
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x},${y}`;
  }).join(' ');
  const color = p.direction === 'up' ? 'var(--red)' : p.direction === 'down' ? 'var(--green)' : 'var(--accent)';

  return `
    <div class="spark-item">
      <div class="spark-label">${p.ingredient}</div>
      <svg class="spark-svg" viewBox="0 0 200 32" preserveAspectRatio="none">
        <polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="${200 - 4}" cy="${32 - 4 - ((vals[vals.length-1] - min) / range) * (32 - 8)}" r="3" fill="${color}"/>
      </svg>
      <div class="spark-current ${p.direction === 'up' ? 'up' : 'stable'}">${p.current}</div>
    </div>
  `;
}

function renderRec(r, num) {
  const effortColor = { low: 'var(--green)', medium: 'var(--yellow)', high: 'var(--orange)' };
  const catLabel = { vendor_switch: 'Vendor Switch', recipe_reprice: 'Menu Reprice', channel_rebalancing: 'Channel Strategy', order_consolidation: 'Order Ops' };

  return `
    <div class="rec-card">
      <div class="rec-header">
        <div>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
            <span style="width:22px;height:22px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">${num}</span>
            <span class="badge badge-blue">${catLabel[r.category] || r.category}</span>
            <span style="font-size:11px;color:${effortColor[r.effort]}">● ${capitalize(r.effort)} effort</span>

          <div class="rec-title">${r.title}</div>

        <div class="rec-savings">
          <div class="rec-savings-val">+$${r.savings.toLocaleString()}/mo</div>

        </div>

}

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

function acceptRec(num) {
  const cards = document.querySelectorAll('.rec-card');
  const card = cards[num - 1];
  if (card) {
    const btn = card.querySelector('.btn-accept');
    btn.textContent = '✓ Accepted';
    btn.style.background = 'var(--green-dim)';
    btn.style.color = 'var(--green)';
    btn.disabled = true;
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
init();
</script>
