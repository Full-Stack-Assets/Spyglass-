<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Spyglass</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0b0f;
            --surface: #12141a;
            --border: #1e2028;
            --amber: #e8a230;
            --amber-dim: #c4882a;
            --text: #e8e6e1;
            --text-dim: #8a8b8e;
            --text-bright: #ffffff;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .grain {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        nav {
            padding: 28px 48px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            border: 2px solid var(--amber);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .card-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 24px 80px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
        }

        .card h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-bright);
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 15px;
            color: var(--text-dim);
            margin-bottom: 36px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input::placeholder {
            color: #4a4b4e;
        }

        .form-group input:focus {
            border-color: var(--amber);
        }

        .btn-primary {
            width: 100%;
            padding: 14px 24px;
            background: var(--amber);
            color: var(--bg);
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background: var(--amber-dim);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(220, 60, 60, 0.1);
            border: 1px solid rgba(220, 60, 60, 0.3);
            color: #e05555;
            font-size: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .card-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: var(--text-dim);
        }

        .card-footer a {
            color: var(--amber);
            text-decoration: none;
            font-weight: 500;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        footer {
            border-top: 1px solid var(--border);
            padding: 32px 48px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-left {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            color: var(--text-dim);
        }

        .footer-right {
            font-size: 13px;
            color: var(--text-dim);
        }

        .footer-right a {
            color: var(--amber);
            text-decoration: none;
        }

        @media (max-width: 768px) {
            nav { padding: 20px 24px; }
            .card { padding: 36px 24px; }
            footer { padding: 24px; flex-direction: column; gap: 12px; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="content">
        <nav>
            <a href="/" class="logo">
                <div class="logo-icon">&#9678;</div>
                Spyglass
            </a>
        </nav>

        <div class="card-wrapper">
            <div class="card">
                <h1>Create account</h1>
                <p class="card-subtitle">Get started with autonomous competitive intelligence.</p>

                <div class="error-message" id="errorMessage"></div>

                <form id="signupForm" onsubmit="return false;">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@company.com" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Choose a password" required minlength="8">
                    </div>
                    <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
                </form>

                <div class="card-footer">
                    Already have an account? <a href="/login">Log in</a>
                </div>
            </div>
        </div>

        <footer>
            <div class="footer-left">Spyglass &copy; 2026</div>
            <div class="footer-right">Built autonomously by <a href="https://polsia.com">Polsia</a></div>
        </footer>
    </div>

    <script>
    (function() {
        var form = document.getElementById('signupForm');
        var errorEl = document.getElementById('errorMessage');
        var submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            errorEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            var name = document.getElementById('name').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            if (password.length < 8) {
                errorEl.textContent = 'Password must be at least 8 characters.';
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create account';
                return;
            }

            fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email, password: password })
            })
            .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
            .then(function(result) {
                if (!result.ok || !result.data.success) {
                    throw new Error(result.data.message || 'Could not create account. Please try again.');
                }
                localStorage.setItem('token', result.data.token);
                window.location.href = '/dashboard';
            })
            .catch(function(err) {
                errorEl.textContent = err.message || 'Something went wrong. Please try again.';
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create account';
            });
        });
    })();
    </script>

    <!-- Polsia Analytics -->
    <script>
    (function() {
        var slug = 'spyglass-10';
        if (!slug) return;
        var vid = localStorage.getItem('polsia_vid');
        if (!vid) {
            vid = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
            localStorage.setItem('polsia_vid', vid);
        }
        new Image().src = 'https://polsia.com/api/beacon/pixel?s=' + encodeURIComponent(slug) + '&v=' + encodeURIComponent(vid);
    })();
    </script>
</body>
</html>
